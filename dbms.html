<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Property Management Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #10b981;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text-main); 
            overflow-x: hidden; 
        }

        #home-screen { 
            padding: 40px 15px; /* Reduced padding for mobile */
            max-width: 1200px; 
            margin: auto; 
            text-align: center; 
        }

        .header-title { 
            font-size: 2rem; /* Scaled down for mobile default */
            margin-bottom: 30px; 
            color: var(--primary); 
            font-weight: 800; 
            line-height: 1.2;
        }
        
        .property-grid {
            display: grid;
            /* Changed to 1fr by default for mobile, then auto-fit for larger screens */
            grid-template-columns: 1fr; 
            gap: 20px;
            margin-top: 20px;
        }

        .property-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            /* Prevents blue highlight on tap in mobile chrome */
            -webkit-tap-highlight-color: transparent;
        }

        .property-img { 
            width: 100%; 
            height: 180px; /* Slightly shorter for mobile */
            object-fit: cover; 
            background: #eee; 
        }

        .property-info { padding: 20px; }
        .property-info h3 { margin: 0 0 15px; font-size: 1.2rem; }
        
        .btn-select {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px; /* Taller padding for easier "thumb" tapping */
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */

        /* Tablets and Desktops */
        @media (min-width: 640px) {
            #home-screen { padding: 60px 20px; }
            .header-title { font-size: 2.8rem; }
            .property-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 25px;
            }
            .property-img { height: 200px; }
            .property-card:hover { transform: translateY(-8px); }
        }

        /* Hover effects only for devices that have a mouse */
        @media (hover: hover) {
            .btn-select:hover { background: var(--accent); }
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1 class="header-title">PROPERTY DATA BASE</h1>

        <div class="property-grid">
            <!-- Cards remain the same but now benefit from the responsive grid -->
            <div class="property-card" onclick="openDashboard('parampara')">
                <img src="https://parampararesort.com/wp-content/uploads/2023/10/Parampara.png" class="property-img" alt="Parampara">
                <div class="property-info">
                    <h3>Parampara Resort</h3>
                    <button class="btn-select">Select Property</button>
                </div>
            </div>

            <div class="property-card" onclick="openDashboard('uknature')">
                <img src="https://uknaturestay.com/wp-content/uploads/2026/02/cropped-UK-nature-stay-logo.png" class="property-img" alt="UK Nature Stay">
                <div class="property-info">
                    <h3>UK Nature Stay</h3>
                    <button class="btn-select">Select Property</button>
                </div>
            </div>

            <div class="property-card" onclick="openDashboard('pragati')">
                <img src="https://lh3.googleusercontent.com/gps-cs-s/APNQkAEihbdgWpwcOX5P00yLnuXeGSRRacPjampCJ48pNOJPY_jEJ6xr999i83EG_b4lQjZTKeIArN1JE62jGag_8kH289hRIfTpp_oBvumFe3BI48Ze1Gwjy5jP0nHWs869av-h2Ys=s680-w680-h510-rw" class="property-img" alt="Pragati">
                <div class="property-info">
                    <h3>Pragati Homestay</h3>
                    <button class="btn-select">Select Property</button>
                </div>
            </div>

            <div class="property-card" onclick="openDashboard('tulasi')">
                <img src="https://pix7.agoda.net/hotelImages/81240829/0/814b5d2bb5d7e4ef565ae71a9313a039.jpg?ce=3&s=414x232&ar=16x9" class="property-img" alt="Tulasi">
                <div class="property-info">
                    <h3>Tulasi Homestay</h3>
                    <button class="btn-select">Select Property</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openDashboard(property) {
            const routes = {
                parampara: 'pa.html',
                uknature: 'uk.html',
                pragati: 'pr.html',
                tulasi: 'tu.html'
            };
            window.location.href = routes[property];
        }
    </script>
</body>
</html>
